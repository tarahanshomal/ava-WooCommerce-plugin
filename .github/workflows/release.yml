name: Publish plugin ZIP
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['ava-woocommerce-plugin.php', '.github/workflows/release.yml']
  release:
    types: [published]
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REQUESTED_RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine and validate release version
        env:
          PLUGIN_MAIN_FILE: ava-woocommerce-plugin.php
        run: |
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          text = Path(os.environ['PLUGIN_MAIN_FILE']).read_text()
          version = re.search(r'^\s*\*?\s*Version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$', text, re.MULTILINE).group(1)
          tag = 'v' + version
          requested = os.environ.get('REQUESTED_RELEASE_TAG', '')
          if requested and requested != tag:
              raise SystemExit('Release tag does not match plugin version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=' + tag + '\n')
          PYVERSION
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Behavioral regression tests (HTTP mocked)
        run: php tests/run.php
      - name: Distribution tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build canonical and original-directory upgrade ZIPs with checksums
        run: |
          python scripts/package.py --tag "$RELEASE_TAG"
          python scripts/package.py --tag "$RELEASE_TAG" --legacy-upgrade
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/*.zip build/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" build/*.zip build/*.sha256 --target "$GITHUB_SHA" --title "Ava WooCommerce $RELEASE_TAG" --generate-notes
          fi
